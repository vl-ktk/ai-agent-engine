[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-engine"
version = "0.3.14a0"
description = "Owner-operated, provider-neutral open-source agent runtime prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AI Agent Engine contributors"}]
dependencies = []

[project.optional-dependencies]
siwc = ["PyJWT[crypto]>=2.10,<3"]

[tool.setuptools]
packages = ["ai_agent_engine"]
