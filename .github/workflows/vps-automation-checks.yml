name: VPS automation config (offline)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vps-automation-checks.yml'
      - 'infra/ansible/**'
      - 'infra/bootstrap/**'
      - 'STAGE4_2_AUTOMATION_PLAN.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-automation-checks.yml'
      - 'infra/ansible/**'
      - 'infra/bootstrap/**'
      - 'STAGE4_2_AUTOMATION_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-offline:
    name: Ansible inventory and playbook syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Ansible Core
        run: python -m pip install 'ansible-core==2.21.5'
      - name: Validate bootstrap shell syntax without connecting
        run: bash -n infra/bootstrap/create_deploy_user.sh
      - name: Validate inventory without connecting
        run: ansible-inventory -i infra/ansible/inventory.example.yml --list
      - name: Validate playbook syntax without connecting
        run: ANSIBLE_CONFIG=infra/ansible/ansible.cfg ansible-playbook --syntax-check -i infra/ansible/inventory.example.yml infra/ansible/verify.yml
      - name: Validate Debian 13 baseline syntax without connecting
        run: ANSIBLE_CONFIG=infra/ansible/ansible.cfg ansible-playbook --syntax-check -i infra/ansible/inventory.example.yml infra/ansible/debian13-user-baseline.yml
      - name: Validate read-only access audit syntax without connecting
        run: ANSIBLE_CONFIG=infra/ansible/ansible.cfg ansible-playbook --syntax-check -i infra/ansible/inventory.example.yml infra/ansible/read-only-access-audit.yml
