name: CI (offline)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional OAuth test requirements
        run: python -m pip install -r requirements-siwc.txt
      - name: Compile application and tests
        run: python -m compileall -q ai_agent_engine tests
      - name: Scan tracked public files for secrets
        run: python scripts/check_public_source.py
      - name: Enforce reviewed workflow security boundaries
        run: python scripts/check_workflow_boundaries.py
      - name: Run offline unit and synthetic integration tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python -m ai_agent_engine
      - name: Install core package from checked-out source
        run: python -m pip install --no-deps .
      - name: Verify installed package outside the repository
        working-directory: ${{ runner.temp }}
        run: python -m ai_agent_engine
  package-build:
    name: Build and exercise isolated wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build wheel with the pinned pyproject build backend
        run: python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/wheels" .
      - name: Install only the locally built wheel
        run: python -m pip install --no-deps --no-index --find-links "${{ runner.temp }}/wheels" ai-agent-engine
      - name: Rehearse immutable release preflight and manifest offline
        shell: bash
        run: |
          set -Eeuo pipefail
          checkout_head="$(git rev-parse HEAD)"
          python -m scripts.release_preflight resolve \
            --selected-ref "$checkout_head" \
            --expected-main "$checkout_head" \
            --workflow-head "$checkout_head" \
            --observed-main "$checkout_head" \
            --github-output "$RUNNER_TEMP/rehearsal-output"
          python -m scripts.release_preflight scan --repo .
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m scripts.release_preflight manifest \
            --release-dir "$RUNNER_TEMP/wheels" --wheel "${wheels[0]}" \
            --commit "$checkout_head" --selected-ref "$checkout_head" \
            --expected-main "$checkout_head"
      - name: Rehearse verified immutable install and atomic promotion locally
        shell: bash
        run: |
          set -Eeuo pipefail
          release_sha="$(git rev-parse HEAD)"
          local_root="$RUNNER_TEMP/ai-agent-engine"
          wheel_digest="$(python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"wheels"/"release-manifest.json"; print(json.loads(p.read_text())["wheel_sha256"])')"
          mkdir -p "$local_root/releases"
          python -m infra.deploy.promotion verify \
            --bundle "$RUNNER_TEMP/wheels" --source-sha "$release_sha" \
            --expected-wheel-sha256 "$wheel_digest"
          python -m infra.deploy.promotion stage \
            --bundle "$RUNNER_TEMP/wheels" --source-sha "$release_sha" \
            --expected-wheel-sha256 "$wheel_digest" \
            --root "$local_root" --confirmation OWNER_APPROVED_RELEASE_OPERATION
          python -m infra.deploy.promotion promote \
            --source-sha "$release_sha" --root "$local_root" \
            --expected-current NONE --confirmation OWNER_APPROVED_RELEASE_OPERATION
          test "$(readlink "$local_root/current")" = "releases/$release_sha"
          test -x "$local_root/current/venv/bin/python"
          test "$(stat -c '%a' "$local_root/releases/$release_sha")" = 755
          "$local_root/current/venv/bin/python" -I -m ai_agent_engine.controller \
            check --health-file "$RUNNER_TEMP/nonexistent-controller-health" && exit 1
          echo 'PASS: disposable release promotion; no VPS/service touched'
      - name: Exercise installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip show ai-agent-engine
          python -m ai_agent_engine
