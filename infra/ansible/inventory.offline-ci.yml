---
# Only for unprivileged GitHub Actions check-mode smoke tests.
# This inventory never resolves or connects to the real VPS.
all:
  children:
    ai_agent_engine_vps:
      hosts:
        ci-localhost:
          ansible_connection: local
          ansible_host: 127.0.0.1
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
